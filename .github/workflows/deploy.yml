# Builds the Obsidian notes (notes/) into data/notes.json and deploys the site to GitHub Pages.
# Runs on every push to main, and on demand from the Actions tab ("Run workflow").
name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install markdown tooling
        run: npm install --no-audit --no-fund
      - name: Build notes from Obsidian vault
        run: npm run notes
      - name: Assemble site (vault, scripts and tooling are not published)
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'notes' --exclude 'scripts' --exclude 'node_modules' \
            --exclude 'package.json' --exclude 'package-lock.json' --exclude 'server.ps1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
